services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - nexo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  nexo-api:
    build: ./nexo-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ORDER_TOKEN: ${ORDER_TOKEN}
      AGENT_TOKEN: ${AGENT_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_TZ: ${APP_TZ:-America/Caracas}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - nexo-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Sitio estático + proxy de /api y /admin hacia nexo-api.
  # Sin puertos en el host: lo expone Dokploy vía dominio (pestaña Domains).
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - nexo-uploads:/usr/share/nginx/html/img/uploaded
    depends_on:
      - nexo-api
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  nexo-data:
  nexo-uploads:

networks:
  dokploy-network:
    external: true