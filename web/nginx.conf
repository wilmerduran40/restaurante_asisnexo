server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS de Docker para re-resolución dinámica del upstream (evita 502 tras recrear nexo-api)
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Estáticos del sitio (index.html, menu.html, css, data, img)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        internal;
    }

    # API REST -> nexo-api (proxy con variable => resuelve DNS por petición)
    location /api/ {
        set $api_upstream http://nexo-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Panel /admin (SPA servida por nexo-api)
    location /admin {
        set $api_upstream http://nexo-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}